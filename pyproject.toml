[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lenkraster"
version = "0.1.1"
description = "Bounded pixel-art critique, palette, animation QA, Aseprite, and local MCP tools."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "ASSET_LICENSE.md", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Ryan Lenk" }]
keywords = ["pixel-art", "sprites", "aseprite", "game-dev", "mcp", "color", "critique"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Artistic Software",
  "Topic :: Games/Entertainment",
]
dependencies = ["numpy>=2.0,<3", "Pillow>=12.3,<13"]

[project.optional-dependencies]
mcp = []            # server needs nothing beyond base deps
dev = [
  "bandit==1.9.4",
  "build==1.5.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "setuptools==84.0.0",
]

[project.scripts]
lenkraster = "lenkraster.cli:main"
lenkraster-mcp = "lenkraster.mcp_main:main"

[project.urls]
Homepage = "https://github.com/itsryanlenk/lenkraster"
Documentation = "https://github.com/itsryanlenk/lenkraster#readme"
Issues = "https://github.com/itsryanlenk/lenkraster/issues"
Security = "https://github.com/itsryanlenk/lenkraster/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lenkraster = ["data/palettes/*.json"]
